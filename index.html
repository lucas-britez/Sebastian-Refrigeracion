<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sebastián Refrigeración - Resistencia, Chaco</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SDK Oficial de Gemini (Carga para evitar errores de CORS) -->
    <script type="module">
        import { GoogleGenAI } from 'https://esm.run/@google/genai';
        window.GoogleGenAI = GoogleGenAI;
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }
        .accent-text { color: #00B2A9; }
        .accent-bg { background-color: #00B2A9; }
        .accent-border { border-color: #00B2A9; }
        
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0px); }
        }
        .animate-fade-up { animation: fadeInUp 1s ease-out forwards; }
        
        .chat-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom right;
        }
        .chat-hidden { opacity: 0; transform: scale(0.8) translateY(20px); pointer-events: none; visibility: hidden; }
        .chat-visible { opacity: 1; transform: scale(1) translateY(0); pointer-events: auto; visibility: visible; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #00B2A9; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- UTILS: Image Cache ---
        const getCachedImage = async (url, key) => {
            const cached = localStorage.getItem(`img_cache_${key}`);
            if (cached) return cached;
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const base64data = reader.result;
                        try { localStorage.setItem(`img_cache_${key}`, base64data); } catch (e) {}
                        resolve(base64data);
                    };
                    reader.readAsDataURL(blob);
                });
            } catch (e) { return url; }
        };

        // --- SERVICE: Gemini SDK ---
        const SYSTEM_INSTRUCTION = `Eres 'Frost', el asistente inteligente de 'Sebastián Refrigeración' en Resistencia, Chaco. PROTOCOLO: 1. Prioridad Comercial. 2. Tu Misión: No des instrucciones de reparación, convence de contratar un técnico. 3. Estrategia: Ante fallas, explica riesgos y recomienda a Sebastián. 4. Cierre: Invita a pedir presupuesto por WhatsApp. 5. Contacto Humano: Indica usar los botones verdes flotantes.`;
        
        const getFrostResponse = async (history) => {
            const API_KEY = "AIzaSyDiirqN2452Im67H3HFZ3STfAW0kBnMRBQ";
            
            if (!window.GoogleGenAI) {
                return "Cargando sistemas de inteligencia... Por favor, intenta de nuevo en un segundo.";
            }

            try {
                const ai = new window.GoogleGenAI({ apiKey: API_KEY });
                
                // Formateamos el historial para el SDK
                const contents = history.map(m => ({
                    role: m.role === 'user' ? 'user' : 'model',
                    parts: [{ text: m.text }]
                }));

                const response = await ai.models.generateContent({
                    model: 'gemini-3-flash-preview',
                    contents: contents,
                    config: {
                        systemInstruction: SYSTEM_INSTRUCTION,
                        temperature: 0.7,
                        topP: 0.95,
                        maxOutputTokens: 800,
                    },
                });

                return response.text;
            } catch (e) {
                console.error("Detailed Frost Error:", e);
                return "Lo siento, tengo un problema de conexión con mis circuitos de frío. Por favor, contactá a Sebastián por WhatsApp para un diagnóstico directo.";
            }
        };

        // --- COMPONENTS ---
        const Navbar = () => {
            const [logoSrc, setLogoSrc] = useState('https://i.ibb.co/WWs7VrVs/IMG-20260217-WA0064.jpg');
            useEffect(() => { getCachedImage('https://i.ibb.co/WWs7VrVs/IMG-20260217-WA0064.jpg', 'navbar_logo').then(setLogoSrc); }, []);
            return (
                <nav className="fixed top-0 left-0 right-0 z-50 bg-[#121212]/80 backdrop-blur-md border-b border-white/10">
                    <div className="max-w-7xl mx-auto px-6 h-24 flex items-center justify-between">
                        <h1 className="text-xl md:text-3xl font-black tracking-tighter text-white uppercase italic">
                            SEBASTIÁN <span className="accent-text">REFRIGERACIÓN</span>
                        </h1>
                        <img src={logoSrc} alt="Logo" className="h-16 md:h-20 w-auto object-contain" />
                    </div>
                </nav>
            );
        };

        const Hero = () => {
            const [bgSrc, setBgSrc] = useState('https://i.ibb.co/8DBnrVkk/20260305-123710.jpg');
            useEffect(() => { getCachedImage('https://i.ibb.co/8DBnrVkk/20260305-123710.jpg', 'hero_bg').then(setBgSrc); }, []);
            return (
                <section className="relative h-screen w-full flex items-center justify-center overflow-hidden">
                    <div className="absolute inset-0 bg-cover bg-center" style={{ backgroundImage: `url("${bgSrc}")` }}>
                        <div className="absolute inset-0 bg-gradient-to-b from-black/80 via-black/40 to-black/90"></div>
                    </div>
                    <div className="relative z-10 text-center px-6 max-w-5xl animate-fade-up">
                        <span className="accent-text font-bold tracking-[0.4em] uppercase mb-4 block text-xs md:text-sm drop-shadow-lg">Especialistas en Climatización Profesional</span>
                        <h2 className="text-4xl sm:text-6xl md:text-8xl font-black text-white leading-[0.9] mb-8">CONFORT Y <span className="accent-text">CLIMATIZACIÓN</span> PARA TU HOGAR</h2>
                        <p className="text-gray-200 text-base md:text-xl max-w-2xl mx-auto font-medium">Servicio técnico integral en Resistencia, Chaco. Instalación, mantenimiento y reparación con estándares de alta montaña.</p>
                    </div>
                </section>
            );
        };

        const Services = () => {
            const services = [
                { 
                    title: 'Instalación y limpieza de split y aire ventana', 
                    desc: 'Montaje profesional bajo normas de fábrica y limpieza profunda para asegurar un aire libre de alérgenos y un rendimiento óptimo en los días de mayor calor en Resistencia.', 
                    img: 'https://i.ibb.co/gbS6sy6s/Screenshot-20260217-062139-Facebook-1.jpg',
                    benefits: ['Normas de fábrica', 'Aire sin alérgenos', 'Rendimiento máximo']
                },
                { 
                    title: 'Carga de gas y cambio de capacitor', 
                    desc: 'Diagnóstico preciso y recarga de refrigerante. Solucionamos problemas de arranque y falta de rendimiento de inmediato para que tu equipo vuelva a enfriar al 100%.', 
                    img: 'https://i.ibb.co/CKND5yrw/Screenshot-20260217-062142-Facebook-1.jpg',
                    benefits: ['Carga de gas', 'Arranque inmediato', 'Frío garantizado']
                },
                { 
                    title: 'Mantenimiento en general', 
                    desc: 'Revisiones preventivas de circuitos eléctricos, desagües y filtros. Alargamos la vida útil de tu equipo y reducimos el consumo eléctrico de tu hogar.', 
                    img: 'https://i.ibb.co/8DrppxSd/Screenshot-20260217-062513-Facebook-1.jpg',
                    benefits: ['Ahorro energético', 'Vida útil extendida', 'Prevención de fallas']
                }
            ];
            return (
                <section className="py-24 px-6 bg-[#121212]">
                    <div className="max-w-7xl mx-auto">
                        <h2 className="text-4xl md:text-6xl font-black mb-16">MANTENÉ TU <span className="accent-text">EQUILIBRIO</span> TÉRMICO</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                            {services.map((s, i) => (
                                <div key={i} className="glass rounded-3xl overflow-hidden group animate-fade-up flex flex-col h-full" style={{animationDelay: `${i * 0.2}s`}}>
                                    <div className="h-56 overflow-hidden relative">
                                        <img src={s.img} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 opacity-70 group-hover:opacity-100" />
                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent"></div>
                                        <h3 className="absolute bottom-4 left-6 text-xl font-black text-white leading-tight pr-4 drop-shadow-lg">{s.title}</h3>
                                    </div>
                                    <div className="p-8 flex flex-col flex-grow">
                                        <p className="text-gray-400 mb-6 flex-grow text-sm leading-relaxed">{s.desc}</p>
                                        <ul className="space-y-3">
                                            {s.benefits.map((b, idx) => (
                                                <li key={idx} className="flex items-center text-[10px] font-black uppercase tracking-widest text-[#00B2A9]">
                                                    <span className="w-2 h-2 accent-bg rounded-full mr-3 shadow-[0_0_10px_#00B2A9]"></span>
                                                    {b}
                                                </li>
                                            ))}
                                        </ul>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        const FrostChat = ({ isOpen, onClose }) => {
            const [messages, setMessages] = useState(() => {
                const saved = localStorage.getItem('frost_chat_history');
                return saved ? JSON.parse(saved) : [];
            });
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [avatarSrc, setAvatarSrc] = useState('https://i.ibb.co/j9DDb3TR/1772731924387-1.png');
            const scrollRef = useRef();

            useEffect(() => { getCachedImage('https://i.ibb.co/j9DDb3TR/1772731924387-1.png', 'frost_avatar').then(setAvatarSrc); }, []);
            useEffect(() => { 
                localStorage.setItem('frost_chat_history', JSON.stringify(messages));
                if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
            }, [messages, isTyping]);

            const handleSend = async () => {
                if (!input.trim() || isTyping) return;
                const userMsg = { role: 'user', text: input };
                const newMsgs = [...messages, userMsg];
                setMessages(newMsgs);
                setInput('');
                setIsTyping(true);
                
                const res = await getFrostResponse(newMsgs);
                setIsTyping(false);
                setMessages(prev => [...prev, { role: 'model', text: res }]);
            };

            return (
                <div className={`fixed bottom-24 right-6 z-[100] chat-transition ${isOpen ? 'chat-visible' : 'chat-hidden'}`}>
                    <div className="glass w-[320px] sm:w-[380px] h-[500px] rounded-3xl overflow-hidden shadow-2xl flex flex-col border border-[#00B2A9]/30">
                        <div className="accent-bg p-5 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <img src={avatarSrc} className="w-10 h-10 rounded-full border-2 border-black object-cover" />
                                <div><h4 className="font-black text-black text-xs tracking-widest uppercase">Frost Assistant</h4><p className="text-[10px] text-black/70 font-bold uppercase">Diagnóstico IA</p></div>
                            </div>
                            <button onClick={onClose} className="text-black font-bold p-2 hover:scale-110 transition-transform">✕</button>
                        </div>
                        <div ref={scrollRef} className="flex-grow overflow-y-auto p-5 space-y-4 bg-black/20">
                            {/* Saludo Visual Estático */}
                            {messages.length === 0 && (
                                <div className="glass p-5 rounded-2xl border-dashed border-white/20 animate-fade-up">
                                    <p className="accent-text font-black text-xs uppercase tracking-widest mb-2">¡Hola! Soy Frost</p>
                                    <p className="text-gray-300 text-xs leading-relaxed">¿Tu equipo no enfría bien o hace ruidos extraños? Escribí abajo tu problema y te daré un diagnóstico instantáneo.</p>
                                </div>
                            )}
                            
                            {messages.map((m, i) => (
                                <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`max-w-[85%] p-4 rounded-2xl text-sm ${m.role === 'user' ? 'accent-bg text-black font-medium' : 'glass text-gray-200'}`}>{m.text}</div>
                                </div>
                            ))}
                            {isTyping && <div className="text-xs accent-text animate-pulse">Frost está analizando tu caso...</div>}
                        </div>
                        <div className="p-4 bg-black/40 flex gap-2">
                            <input type="text" value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleSend()} placeholder="Describe la falla..." className="flex-grow bg-white/5 border border-white/10 rounded-xl px-4 py-2 text-xs text-white outline-none" />
                            <button onClick={handleSend} className="accent-bg text-black p-2 rounded-xl hover:scale-105 transition-transform">➤</button>
                        </div>
                    </div>
                </div>
            );
        };

        const WhatsAppButtons = ({ onToggleFrost }) => (
            <div className="fixed bottom-6 right-6 z-[90] flex flex-col gap-3 items-end w-full max-w-[280px] sm:max-w-xs">
                <button onClick={onToggleFrost} className="accent-bg text-black px-6 py-4 rounded-xl font-black text-xs uppercase tracking-wider shadow-xl border border-white/20 hover:scale-105 transition-transform text-right leading-tight">Chatea con Frost, nuestra IA y resuelve tus dudas</button>
                <a href="https://wa.me/543624175071" target="_blank" className="bg-[#25D366] text-white px-6 py-3 rounded-xl font-black text-sm uppercase tracking-widest w-full text-center hover:scale-105 transition-transform">Chatea por WhatsApp</a>
                <a href="https://wa.me/543624175080" target="_blank" className="bg-[#25D366] text-white px-6 py-3 rounded-xl font-black text-sm uppercase tracking-widest w-full text-center hover:scale-105 transition-transform">Número de respaldo</a>
            </div>
        );

        const App = () => {
            const [isChatOpen, setIsChatOpen] = useState(false);
            return (
                <div className="relative selection:bg-[#00B2A9] selection:text-black">
                    <Navbar />
                    <Hero />
                    <Services />
                    <section className="py-24 px-6 bg-black relative overflow-hidden">
                        <div className="max-w-4xl mx-auto text-center animate-fade-up">
                            <h3 className="text-4xl md:text-6xl font-black mb-8 uppercase">SOMOS <span className="accent-text">CHACO</span>. SOMOS REFRIGERACIÓN.</h3>
                            <p className="text-gray-300 text-lg md:text-xl leading-relaxed">
                                Entendemos lo que significa vivir en Resistencia con temperaturas de 40 grados. No es solo comodidad, es salud. Por eso, Sebastián Refrigeración nació para ofrecer el servicio técnico más confiable y rápido de la zona, adaptado a las exigencias de nuestro clima extremo.
                            </p>
                        </div>
                    </section>
                    <footer className="py-12 border-t border-white/5 bg-[#121212] px-6 text-center">
                        <div className="max-w-7xl mx-auto">
                            <h4 className="text-xl font-black italic mb-2 uppercase">SEBASTIÁN <span className="accent-text">REFRIGERACIÓN</span></h4>
                            <p className="text-gray-500 text-sm">Resistencia, Chaco - Argentina</p>
                            <p className="text-gray-600 text-[10px] mt-4">© {new Date().getFullYear()} - Todos los derechos reservados</p>
                        </div>
                    </footer>
                    <FrostChat isOpen={isChatOpen} onClose={() => setIsChatOpen(false)} />
                    <WhatsAppButtons onToggleFrost={() => setIsChatOpen(!isChatOpen)} />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
